permissions:
  contents: read
  packages: write
concurrency: helm-${{ github.ref }}
name: Build and Publish Charts
on:
  push:

jobs:
  kubeconform:
    name: kubeconform
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        chart: &chart-list ["mysql", "postgresql"]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2
      - name: Set up Kubeconform
        id: setup-kubeconform
        uses: bmuschko/setup-kubeconform@e5d264ec1eafe2314e750c429a9da7639dd5a003
        with:
          kubeconform-version: "0.7.0"
      - name: Run kubeconform
        run: |
          echo "Running kubeconform with default values"
          helm template charts/${{ matrix.chart }} | kubeconform -summary

  trivy:
    name: trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        chart: *chart-list
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: conf
          scan-ref: charts/${{ matrix.chart }}

  helm_test:
    name: helm test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        chart: *chart-list
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        helm_version: ["v3.19.2", "v4.0.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2
        with:
          version: ${{ matrix.helm_version }}
      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc
        with:
          version: v0.30.0
          kubectl_version: v1.34.0
          node_image: kindest/node:v1.34.0
      - name: Install chart
        run: |
          helm install test-${{ matrix.chart }} charts/${{ matrix.chart }} \
            --values charts/${{ matrix.chart }}/ci/test-values.yaml \
            --wait --timeout=300s --debug
      - name: Run helm test
        run: helm test test-${{ matrix.chart }} --timeout=300s
      - name: Debug on failure
        if: failure()
        run: |
          kubectl get pods
          kubectl describe pods
          kubectl logs -l app.kubernetes.io/name=mysql --tail=50

  helm_publish_oci:
    name: Publish to OCI Registry
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        chart: *chart-list
    if: github.ref_name == 'main'
    needs: [kubeconform, trivy, helm_test]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2
      - name: Package with Helm
        id: package
        run: |
          helm package charts/${{ matrix.chart }}
      - name: Login to GHCR
        run: echo ${{ secrets.GITHUB_TOKEN }} | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Check if version exists
        id: check-version
        run: |
          VERSION=$(helm show chart charts/${{ matrix.chart }} | grep '^version:' | cut -d' ' -f2)
          if helm pull oci://ghcr.io/${{ github.repository_owner }}/${{ matrix.chart }} --version $VERSION 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Chart version $VERSION already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Chart version $VERSION does not exist"
          fi
      - name: Push to GHCR
        if: steps.check-version.outputs.exists == 'false'
        run: helm push ${{ matrix.chart }}-*.tgz oci://ghcr.io/${{ github.repository_owner }}
