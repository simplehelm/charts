permissions:
  contents: read
  packages: write
concurrency: helm-${{ github.ref }}
name: Build and Publish Charts
on:
  push:

jobs:
  kubeconform:
    name: kubeconform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        chart: &chart-list ["mysql"]
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
      - name: Set up Kubeconform
        id: setup-kubeconform
        uses: bmuschko/setup-kubeconform@5ccaecbbf012bcb1eeeab66e649db64a477ade8f
        with:
          kubeconform-version: "0.7.0"
      - name: Run kubeconform
        run: |
          echo "Running kubeconform with default values"
          helm template charts/${{ matrix.chart }} | kubeconform -summary

  trivy:
    name: trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        chart: *chart-list
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          scan-type: conf
          scan-ref: charts/${{ matrix.chart }}

  helm_test:
    name: helm test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        chart: *chart-list
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
      - name: Create kind cluster
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3
        with:
          version: v0.30.0
          kubectl_version: v1.34.0
          node_image: kindest/node:v1.34.0
      - name: Install chart
        run: |
          helm install test-${{ matrix.chart }} charts/${{ matrix.chart }} \
            --values charts/${{ matrix.chart }}/ci/test-values.yaml \
            --wait --timeout=300s
      - name: Run helm test
        run: helm test test-${{ matrix.chart }} --timeout=300s

  helm_publish_oci:
    name: Publish to OCI Registry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        chart: *chart-list
    if: github.ref_name == 'main'
    needs: [kubeconform, trivy, helm_test]
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
      - name: Package with Helm
        id: package
        run: |
          helm package charts/${{ matrix.chart }}
      - name: Login to GHCR
        run: echo ${{ secrets.GITHUB_TOKEN }} | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Check if version exists
        id: check-version
        run: |
          VERSION=$(helm show chart charts/${{ matrix.chart }} | grep '^version:' | cut -d' ' -f2)
          if helm pull oci://ghcr.io/${{ github.repository_owner }}/${{ matrix.chart }} --version $VERSION 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Chart version $VERSION already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Chart version $VERSION does not exist"
          fi
      - name: Push to GHCR
        if: steps.check-version.outputs.exists == 'false'
        run: helm push ${{ matrix.chart }}-*.tgz oci://ghcr.io/${{ github.repository_owner }}
