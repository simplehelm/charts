apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "mysql.fullname" . }}-test-connection"
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: mysql-test
      image: "{{ .Values.image.repository }}:{{ include "mysql.imageTag" . }}"
      command:
        - mysql
        - -h
        - {{ include "mysql.fullname" . }}-primary
        - -u
        - root
        - -p$(MYSQL_ROOT_PASSWORD)
        - -e
        - "SELECT 1"
      env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.auth.existingSecret | default (include "mysql.fullname" .) }}
              key: mysql-root-password
