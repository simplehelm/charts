# -- Major version of PostgreSQL to use as default tag and in resource labels
majorVersion: "18"

# -- Container image configuration
image:
  # -- PostgreSQL container image repository
  repository: docker.io/library/postgres
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag which by default uses majorVersion
  tag: ""

# -- Secrets for pulling images from private registries
imagePullSecrets: []

# -- Override the chart name
nameOverride: ""
# -- Override the full name
fullnameOverride: ""

# -- Pod annotations
podAnnotations: {}
# -- Pod labels
podLabels: {}

# -- Pod security context
podSecurityContext:
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch

# -- Security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsGroup: 10001
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile:
    type: RuntimeDefault

# -- Resource limits and requests
resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# -- PostgreSQL authentication configuration
# @default -- See values.yaml
auth:
  # -- Name of existing secret to use for credentials (must contain 'postgres-password' key, and 'password' key if username is set)
  existingSecret: ""
  # -- postgres (superuser) user password (required if existingSecret is not set)
  postgresPassword: ""
  # -- Additional database to create
  database: ""
  # -- Additional user to create with all privileges on the additional database
  username: ""
  # -- Password for additional user
  password: ""

# -- Additional environment variables
env: []
# - name: POSTGRES_MAX_CONNECTIONS
#   value: "200"

# -- Persistence configuration
# @default -- See values.yaml
persistence:
  # -- Storage class for persistent volume
  storageClass: ""
  # -- Size of persistent volume
  size: "8Gi"

# -- Liveness probe
livenessProbe:
  exec:
    command:
      - pg_isready
      - -h
      - 127.0.0.1
      - -U
      - postgres
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5

# -- Readiness probe
readinessProbe:
  exec:
    command:
      - pg_isready
      - -h
      - 127.0.0.1
      - -U
      - postgres
  initialDelaySeconds: 5
  periodSeconds: 2
  timeoutSeconds: 1

# -- Node selector for pod assignment
nodeSelector: {}

# -- Tolerations for pod assignment
tolerations: []

# -- Affinity for pod assignment
affinity: {}

# -- Priority class name for pod scheduling
priorityClassName: ""
