# Test configuration using many available parameters
auth:
  postgresPassword: "testpassword"

env:
  - name: POSTGRES_MAX_CONNECTIONS
    value: "100"
  - name: POSTGRES_SHARED_BUFFERS
    value: "256MB"

persistence:
  size: "1Gi"

nodeSelector:
  kubernetes.io/os: linux

podAnnotations:
  test.example.com/ci: "true"

podLabels:
  test-env: "ci"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

livenessProbe:
  initialDelaySeconds: 20
  periodSeconds: 5
  timeoutSeconds: 3

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 2
  timeoutSeconds: 1

tolerations:
  - key: "test-node"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"
