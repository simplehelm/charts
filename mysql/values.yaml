# Default values for mysql.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global configuration
global:
  # Major version of MySQL to use as default tag
  majorVersion: "8.4"

# MySQL primary configuration (StatefulSet always uses 1 replica for primary)

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: docker.io/library/mysql
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag which by default uses global.majorVersion.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# MySQL authentication configuration
auth:
  # Use existing secret for credentials
  existingSecret: ""
  # MySQL root password (will be stored in secret)
  rootPassword: ""
  # MySQL database to create
  database: ""
  # MySQL user to create
  username: ""
  # MySQL user password (will be stored in secret)
  password: ""

# Additional environment variables
# MYSQL_USER, MYSQL_PASSWORD, MYSQL_ROOT_PASSWORD and MYSQL_DATABASE are managed by the auth section
env: []
# - name: MYSQL_MAX_CONNECTIONS
#   value: "200"

# Persistence configuration
persistence:
  # Storage class for persistent volume
  storageClass: ""
  # Size of persistent volume
  size: "8Gi"

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  exec:
    command:
      - mysqladmin
      - ping
      - -h
      - localhost
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
readinessProbe:
  exec:
    command:
      - mysqladmin
      - ping
      - -h
      - localhost
  initialDelaySeconds: 5
  periodSeconds: 2
  timeoutSeconds: 1

nodeSelector: {}

tolerations: []

affinity: {}
